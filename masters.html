<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Наши мастера — Pick Me Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ШАПКА -->
  <header class="header header--static">
    <div class="container header__inner">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Pick Me Studio" class="logo__img" />
        <span class="logo__text">
          <span class="logo__main">Pick Me</span>
          <span class="logo__sub">studio</span>
        </span>
      </a>
      <nav class="nav">
        <a href="index.html#services">Услуги</a>
        <a href="masters.html">Мастера</a>
        <a href="index.html#gallery">Галерея</a>
        <a href="index.html#contacts">Контакты</a>
      </nav>
      <a href="index.html#booking" class="btn">Записаться</a>
    </div>
  </header>

  <!-- ЗАГОЛОВОК СТРАНИЦЫ -->
  <section class="page-head">
    <div class="container">
      <p class="section__eyebrow">наша команда</p>
      <h1 class="page-head__title">Мастера Pick Me Studio</h1>
      <p class="page-head__desc">
        Каждый мастер — специалист с опытом и портфолио.
        Выбирай своего и записывайся удобным способом.
      </p>
    </div>
  </section>

  <!-- ВСЕ МАСТЕРА -->
  <section class="section">
    <div class="container">
      <div class="masters" id="masters-full"></div>

      <div class="masters__more">
        <a href="index.html#booking" class="btn btn--primary">Записаться</a>
      </div>
    </div>
  </section>

  <!-- ПОДВАЛ -->
  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__copy">© 2026 Pick Me Studio</p>
      <a href="index.html" class="footer__link">На главную</a>
    </div>
  </footer>

  <script src="js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/site-content.js" defer></script>
</body>
</html>
